name: Track Roblox risers

on:
  schedule:
    - cron: '4-59/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'dashboard/data.json'
      - '*.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: roblox-tracker
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify analysis
        run: python -m unittest discover -s tests -v
      - name: Collect and analyze
        run: |
          python collect.py
          python analyze.py
      - name: Record collection diagnostics
        env:
          RUN_TRIGGER: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('dashboard/data.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Trigger: {os.environ['RUN_TRIGGER']}\n\n")
              summary.write(f"Snapshot: {data['latest_snapshot']}\n\n")
              summary.write(f"Minutes since previous collection: {data['last_interval_minutes']}\n\n")
              for key in ['since_last', '1', '6', '24']:
                  count = sum((g.get('since_last') if key == 'since_last' else g['windows'].get(key)) is not None for g in data['games'])
                  summary.write(f"{key}: {count} games with comparisons\n\n")
          PY
      - name: Save history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ dashboard/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update player snapshots [skip ci]'
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
